<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tipos</title>
    <style>
        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Lista de Tipos</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tipo : ${listaTipos}">
                <td th:text="${tipo.idTipo}"></td>
                <td th:text="${tipo.nombreTipo}"></td>
                <td th:text="${tipo.descripcionTipo}"></td>
            </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(listaTipos)}" style="text-align:center; margin-top: 10px;">
        <p>No hay tipos registrados.</p>
    </div>
</body>
</html>
